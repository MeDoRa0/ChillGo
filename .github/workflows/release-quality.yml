name: Release quality

on:
  pull_request:
  push:
    branches: [codex/008-production-readiness]

jobs:
  automated-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            functions/package-lock.json
            firestore_tests/package-lock.json
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: npm ci && npm test
        working-directory: functions
      - run: npm ci
        working-directory: firestore_tests
      - run: npm test
        working-directory: firestore_tests
  android-package:
    runs-on: ubuntu-latest
    needs: automated-gates
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.2
      - run: flutter pub get
      - run: flutter build appbundle --release
  ios-metadata:
    runs-on: macos-latest
    needs: automated-gates
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.2
      - run: flutter pub get
      - run: flutter build ipa --release --no-codesign
